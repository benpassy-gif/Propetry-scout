name: Property Scout

on:
  schedule:
    # 07:00 Israel time (IDT=UTC+3; drifts to 08:00 in winter / IST=UTC+2)
    - cron: "0 4 * * 0-5"
    # 19:00 Israel time (drifts to 20:00 in winter)
    - cron: "0 16 * * 0-5"
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Profile ID to run (leave empty for all active)"
        required: false
        default: ""

permissions:
  contents: write

# Prevent two runs stepping on each other if one is slow
concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

       - name: Setup Python venv & deps
        run: |
          # Pin to Python 3.12 - Playwright 1.40 doesn't support 3.14 yet
          # (greenlet dependency has no 3.14 wheels)
          rm -rf .venv
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip --quiet
          pip install -r scraper/requirements.txt --quiet

      - name: Install Playwright Chromium (only if missing)
        run: |
          source .venv/bin/activate
          # Playwright caches browsers in ~/Library/Caches/ms-playwright/
          if ls "$HOME/Library/Caches/ms-playwright/chromium-"* >/dev/null 2>&1; then
            echo "Chromium already cached, skipping download"
          else
            echo "Chromium not found, installing..."
            python -m playwright install chromium
          fi

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPINGBEE_API_KEY:   ${{ secrets.SCRAPINGBEE_API_KEY }}
          PROFILE_ID:            ${{ github.event.inputs.profile_id }}
        run: |
          source .venv/bin/activate
          python scraper/scout.py

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/results.json scraper/profiles.json scraper/seen_listings.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update results [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push; then
                echo "Push successful on attempt $i"
                break
              fi
              echo "Push failed on attempt $i, retrying..."
              sleep 5
            done
          fi

      - name: Notify Telegram on workflow failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=⚠️ Property Scout FAILED. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
